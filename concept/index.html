<head>
    <title>Watch</title>
    <link type="text/css" rel="stylesheet" href="styles.css">
</head>
<body>
<div id="main">
    <div id="header" class="row">
        <span id="bluetooth">ᛒ</span>
        <span id="date">12/28/1990</span>
        <span id="battery-percent">97%</span>
    </div>
    <div id="face">
        <div id="top-row" class="row">
            <div id="current-weather" class="weather">
                <span class="hour">Today</span>
                <img class="icon" src="assets/weather.svg">
                <span class="temp">59°</span>
            </div>
            <div id="day">Mon</div>
            <div id="forecast-tomorrow" class="weather">
                <span class="hour">Tomorrow</span>
                <img class="icon" src="assets/weather.svg">
                <span class="temp">65°/89°</span>
            </div>
        </div>
        <div id="clock-row" class="row">
            <span id="time">12:09</span>
        </div>
        <div id="forecast-row" class="row">
            <div id="forecast-1h" class="weather">
                <span class="hour">1pm</span>
                <img class="icon" src="assets/weather.svg">
                <span class="temp">60°</span>
            </div>
            <div id="forecast-2h" class="weather">
                <span class="hour">2pm</span>
                <img class="icon" src="assets/weather.svg">
                <span class="temp">60°</span>
            </div>
            <div id="forecast-3h" class="weather">
                <span class="hour">3pm</span>
                <img class="icon" src="assets/weather.svg">
                <span class="temp">60°</span>
            </div>
            <div id="forecast-4h" class="weather">
                <span class="hour">4pm</span>
                <img class="icon" src="assets/weather.svg">
                <span class="temp">60°</span>
            </div>
        </div>
    </div>
</div>

</body>
