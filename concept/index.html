<head>
    <title>Watch</title>
    <link type="text/css" rel="stylesheet" href="styles.css">
</head>
<body>
<div id="main">
    <div id="header" class="row">
        <span id="bluetooth">B</span>
        <span id="date">12/28/1990</span>
        <span id="battery-percent">97%</span>
    </div>
    <div id="top-row" class="row">
        <span id="day">Mon</span>
        <div>
            <span class="temp">59*</span>
            <span class="icon">C</span>
        </div>
    </div>
    <div id="clock-row" class="row">
        <span id="time">12:09</span>
    </div>
    <div id="forecast-row" class="row">
        <div id="forecast-1h">
            <span class="hour">1pm</span>
            <span class="temp">60*</span>
            <span class="icon">C</span>
        </div>
        <div id="forecast-2h">
            <span class="hour">2pm</span>
            <span class="temp">60*</span>
            <span class="icon">C</span>
        </div>
        <div id="forecast-3h">
            <span class="hour">3pm</span>
            <span class="temp">60*</span>
            <span class="icon">C</span>
        </div>
        <div id="forecast-4h">
            <span class="hour">4pm</span>
            <span class="temp">60*</span>
            <span class="icon">C</span>
        </div>
    </div>
    <div id="tomorrow-row" class="row">
        <div id="forecast-tomorrow">
            <span>65*/89*</span>
            <span class="icon">C</span>
        </div>
    </div>
</div>


</div>
</body>
